name: Keep repository active

# GitHub отключает запланированные workflow после 60 дней без активности в
# репозитории — вместе с ними умрёт и пинг Supabase. Раз в месяц делаем пустой
# коммит в служебную ветку keep-alive, чтобы этого не происходило.
# main не трогаем, история основной ветки остаётся чистой.

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Empty commit to keep-alive branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin keep-alive > /dev/null 2>&1; then
            git fetch origin keep-alive
            git checkout -B keep-alive origin/keep-alive
          else
            echo "Ветка keep-alive не найдена, создаём пустую"
            git checkout --orphan keep-alive
            git rm -rf --cached . > /dev/null 2>&1 || true
          fi

          git commit --allow-empty -m "chore: keep repository active [skip ci]"
          git push origin keep-alive
          echo "✅ Активность репозитория обновлена"
