name: Keep Supabase awake

# Бесплатный тариф Supabase ставит проект на паузу после ~7 дней без обращений.
# Раз в 3 дня делаем запрос к REST API, чтобы этого не происходило.

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Не заданы секреты VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

          status=$(curl -sS -o response.txt -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/user_data?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo 000)

          echo "HTTP $status"
          cat response.txt || true

          # Проект на паузе не отвечает вообще — код 000. Любой HTTP-ответ
          # означает, что база жива и таймер неактивности сброшен.
          # RLS вернёт анонимному запросу пустой список — это ожидаемо.
          if [ "$status" = "000" ]; then
            echo "::error::Нет ответа от базы — проект на паузе или удалён"
            exit 1
          elif [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "✅ База отвечает, таймер неактивности сброшен"
          else
            echo "::warning::База ответила HTTP $status (пауза сброшена, но запрос неуспешен — проверьте схему и ключи)"
          fi
